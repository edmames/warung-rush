<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warung Rush — Warung Bu Sari</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23c84b31'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23f7efe1' stroke='%233a7a67' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e6a324'/%3E%3C/svg%3E">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #231811;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
      border-radius: 6px;
      overflow: hidden;
      background: #f4e6cf;
    }
    canvas#game {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720" aria-label="Warung Rush - Warung Bu Sari"></canvas>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
